<style>


/* Layout: light glass over brand strands and soft cyan light; one floating glass tab bar; six hash-routed pages on a 1200px rail */
:root{
  color-scheme:light;
  --blue:#0B2A6F; --ink:#071A45; --cyan:#00D4FF; --gray:#8A94A6; --light:#E9EDF5; --white:#FFFFFF;
  --orange:#FF7A00; --orange-h:#E66A00;
  --muted:#43527A; --line:rgba(11,42,111,.14);
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.9);
  --glass-dark:rgba(255,255,255,.08); --glass-dark-edge:rgba(255,255,255,.22);
  --shadow:0 18px 50px rgba(7,26,69,.14);
  --font:"Montserrat","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:4px; --r-md:6px; --r-lg:18px; --r-pill:999px;
  --rail:1200px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--light);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--light)}
main{overflow-x:clip;min-height:70vh}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance;color:var(--blue);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
a{color:var(--blue)}
button,input,select,textarea{font-family:var(--font)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:var(--r-sm)}
.wrap{max-width:var(--rail);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sec{padding-block:72px;position:relative}
.sec.tight{padding-top:8px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--blue)}
.eyebrow::before{content:"";width:26px;height:4px;background:var(--cyan);flex:none}
.h2{font-size:clamp(26px,3.4vw,40px);margin-top:14px}
.lead{font-size:17px;color:var(--muted);max-width:64ch;margin-top:16px}
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:var(--r-lg);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;font:700 14px/20px var(--font);letter-spacing:.02em;padding:13px 22px;border-radius:var(--r-sm);text-decoration:none;border:0;cursor:pointer;transition:background .2s,transform .2s;text-align:center}
.btn-primary{background:var(--orange);color:var(--ink);box-shadow:0 10px 24px rgba(255,122,0,.28)}
.btn-primary:hover{background:var(--orange-h);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.5);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:var(--white)}
.btn[aria-disabled="true"]{background:rgba(255,255,255,.5);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--gray);cursor:default}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--blue);background:rgba(255,255,255,.7);border:1px solid var(--line);padding:4px 11px;border-radius:var(--r-pill)}
.todo{padding:14px 16px;border-radius:14px;border:1px dashed var(--blue);font-size:13.5px;color:var(--muted);background:rgba(255,255,255,.5)}
.field{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.glow{position:absolute;border-radius:50%;filter:blur(70px)}
.sec > .wrap,.hero > .wrap,.phead > .wrap{position:relative;z-index:1}

/* ---------- glass navigation ---------- */
.nav{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.nav-bar{pointer-events:auto;max-width:var(--rail);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 8px 16px;border-radius:var(--r-pill);background:rgba(255,255,255,.52);border:1px solid var(--glass-edge);box-shadow:0 14px 40px rgba(7,26,69,.14),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(11,42,111,.06);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);transition:background .3s,box-shadow .3s}
.nav.scrolled .nav-bar{background:rgba(255,255,255,.76);box-shadow:0 18px 46px rgba(7,26,69,.18),inset 0 1px 0 #fff}
.logo{display:block;height:34px;width:auto}
.logo-link{display:flex;align-items:center;border-radius:var(--r-sm);flex:none}
.tabs{position:relative;display:flex;align-items:center;gap:2px;padding:4px;border-radius:var(--r-pill);background:rgba(11,42,111,.06);box-shadow:inset 0 1px 2px rgba(7,26,69,.08)}
.tab-ind{position:absolute;top:4px;left:0;height:calc(100% - 8px);width:0;border-radius:var(--r-pill);background:linear-gradient(180deg,#fff,rgba(255,255,255,.82));box-shadow:0 4px 14px rgba(7,26,69,.14),inset 0 1px 0 #fff;transition:transform .38s cubic-bezier(.3,1.2,.4,1),width .38s cubic-bezier(.3,1.2,.4,1),opacity .2s;opacity:0}
.tab-ind::after{content:"";position:absolute;left:50%;bottom:5px;width:14px;height:2px;margin-left:-7px;background:var(--cyan);border-radius:2px}
.tab{position:relative;z-index:1;font:600 13.5px/20px var(--font);color:var(--blue);text-decoration:none;padding:9px 15px;border-radius:var(--r-pill);white-space:nowrap}
.nav-right{display:flex;align-items:center;gap:10px}
.lang{display:flex;padding:3px;gap:1px;border-radius:var(--r-pill);background:rgba(11,42,111,.07)}
.lang button{font:700 12px/18px var(--font);color:var(--blue);background:none;border:0;min-width:38px;min-height:34px;padding:6px 8px;border-radius:var(--r-pill);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
.nav-cta{padding:11px 18px;border-radius:var(--r-pill);min-height:44px;white-space:nowrap}
.menu-btn{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:5px;flex:none}
.menu-btn span{display:block;width:18px;height:2px;background:var(--blue)}
.sheet{pointer-events:auto;max-width:var(--rail);margin:10px auto 0;padding:10px;border-radius:var(--r-lg);background:rgba(255,255,255,.86);border:1px solid var(--glass-edge);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);display:grid;gap:2px;max-height:calc(100vh - 110px);overflow:auto}
.sheet[hidden]{display:none}
.sheet a{font:600 16px/24px var(--font);color:var(--blue);text-decoration:none;padding:12px 14px;border-radius:12px}
.sheet a[aria-current="page"]{background:rgba(11,42,111,.07)}
.sheet .lang{margin:8px 6px 4px;align-self:start;justify-self:start}
.sheet .lang button{min-width:52px;min-height:40px;font-size:13px}

/* ---------- hero / page head ---------- */
.hero{position:relative;padding-top:calc(env(safe-area-inset-top,0px) + 146px);padding-bottom:72px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center}
.crumb{font-size:13px;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(32px,4.8vw,58px);line-height:1.12;margin-top:18px;letter-spacing:-.01em}
.hero .lead{font-size:18px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-art{position:relative;min-height:430px}
.hero-art .strands{position:absolute;right:-120px;top:10px;width:120%;height:auto}
.float{position:absolute;padding:18px 20px}
.float .k{font-size:12px;font-weight:700;color:var(--muted)}
.float .v{font-size:18px;font-weight:700;color:var(--blue);line-height:1.3;margin-top:6px}
.f1{left:0;top:52px;width:min(300px,80%)}
.f2{right:4%;bottom:22px;width:min(340px,88%)}
.route{display:flex;align-items:center;margin-top:14px}
.route i{width:11px;height:11px;border-radius:50%;background:var(--blue);flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.route i.c{background:var(--cyan)}
.route u{flex:1;height:2px;background:var(--blue)}
.route-l{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);margin-top:8px}
.phead{position:relative;padding-top:calc(env(safe-area-inset-top,0px) + 140px);padding-bottom:36px}
.phead h1{font-size:clamp(30px,4.2vw,50px);margin-top:16px;letter-spacing:-.01em}

/* ---------- facts band ---------- */
.band{background:var(--ink);color:#fff;overflow:hidden}
.band .eyebrow,.band .h2{color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:36px}
.stat{padding:24px 20px;border-radius:var(--r-lg);background:var(--glass-dark);border:1px solid var(--glass-dark-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.stat .n{font-size:clamp(32px,4vw,50px);font-weight:700;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.stat .bar{width:34px;height:4px;background:var(--cyan);margin:16px 0 12px}
.stat p{font-size:14px;line-height:1.6;color:rgba(255,255,255,.88)}

/* ---------- cards ---------- */
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin-top:36px}
.card{padding:24px 22px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s}
a.card:hover{transform:translateY(-4px);box-shadow:0 26px 60px rgba(7,26,69,.18),inset 0 1px 0 #fff}
.card svg{width:44px;height:44px;flex:none}
.card h3{font-size:17.5px}
.card p{font-size:14px;line-height:1.65;color:var(--muted)}
.more{margin-top:auto;font-size:13.5px;font-weight:700;color:var(--blue);display:inline-flex;gap:8px;align-items:center}
.more::after{content:"";width:16px;height:2px;background:var(--cyan);transition:width .2s}
a.card:hover .more::after{width:28px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:36px}
.quick a{padding:28px;text-decoration:none;display:flex;flex-direction:column;gap:10px}
.quick h3{font-size:22px}
.quick p{color:var(--muted);font-size:15px}
.quick .dark{background:var(--blue);border-color:rgba(255,255,255,.3)}
.quick .dark h3{color:#fff}.quick .dark p{color:rgba(255,255,255,.9)}.quick .dark .more{color:#fff}

/* ---------- services page ---------- */
.svc{display:grid;gap:18px;margin-top:8px}
.svc-item{display:grid;grid-template-columns:64px minmax(0,1.2fr) minmax(0,1fr);gap:24px;padding:28px;align-items:start}
.svc-item > svg{width:56px;height:56px}
.svc-item h3{font-size:22px}
.svc-item .en{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px}
.svc-item p{color:var(--muted);margin-top:10px;font-size:15px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ticks li{display:flex;gap:10px;font-size:14.5px;font-weight:600;color:var(--blue);line-height:1.5}
.ticks li::before{content:"";width:8px;height:8px;background:var(--cyan);margin-top:7px;flex:none}
.svc-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* ---------- network map ---------- */
.map-card{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);overflow:hidden}
.map-side{padding:24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:flex;padding:4px;gap:2px;border-radius:var(--r-pill);background:rgba(11,42,111,.07)}
.seg button{flex:1;font:600 12.5px/18px var(--font);color:var(--blue);background:none;border:0;min-height:40px;padding:8px 6px;border-radius:var(--r-pill);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 3px 10px rgba(7,26,69,.14)}
.pops{display:grid;gap:6px}
.pop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:600 14.5px/20px var(--font);color:var(--blue);background:rgba(255,255,255,.5);border:1px solid transparent;border-radius:12px;min-height:44px;padding:10px 12px;cursor:pointer;transition:background .2s,border-color .2s,opacity .2s}
.pop::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.pop[data-kind="sea"]::before{background:var(--cyan);box-shadow:0 0 0 2px var(--blue)}
.pop[data-kind="gate"]::before{border-radius:0;transform:rotate(45deg);background:var(--orange)}
.pop:hover{background:#fff}
.pop[aria-pressed="true"]{background:#fff;border-color:var(--blue)}
.pop.dim{opacity:.4}
.eq{margin-top:auto;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;gap:12px}
.eq-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eq-h h3{font-size:16px}
.eq-clear{font:700 12.5px/18px var(--font);color:var(--blue);background:none;border:0;min-height:36px;padding:6px 4px;cursor:pointer;white-space:nowrap;flex:none}
.eq-hint{font-size:13px;font-weight:600;color:var(--blue);background:rgba(0,212,255,.16);border-radius:10px;padding:9px 12px}
.ep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--light)}
.ep .bdg{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ep.empty .bdg{background:none;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--gray)}
.ep .k{font-size:11.5px;font-weight:700;color:var(--muted)}
.ep b{display:block;font-size:15px;color:var(--blue);line-height:1.3}
.ep.empty b{color:var(--muted);font-weight:600}
.eq label{font-size:12.5px;font-weight:700;color:var(--blue)}
.eq select{width:100%;font:500 16px/22px var(--font);color:var(--ink);min-height:44px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;margin-top:6px}
.bw-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bw-top output{font-size:18px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.eq input[type=range]{width:100%;accent-color:var(--blue);min-height:32px;margin:0}
.bw-l{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.eq .btn{width:100%}
.btn:disabled{background:var(--light);color:var(--muted);box-shadow:none;cursor:not-allowed;transform:none}
.link{fill:none;stroke:var(--ink);stroke-width:4.5;stroke-linecap:round}
.link-glow{fill:none;stroke:var(--orange);stroke-width:11;stroke-linecap:round;opacity:.35}
.mtag circle{fill:var(--ink)}
.mtag text{font:700 13px var(--font);fill:#fff}
/* ---------- enquiry modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:rgba(7,26,69,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal[hidden]{display:none}
.modal-box{position:relative;width:min(920px,100%);max-height:100%;overflow:auto;border-radius:var(--r-lg);background:rgba(255,255,255,.94);border:1px solid var(--glass-edge);box-shadow:0 30px 80px rgba(7,26,69,.35);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
.modal-form{padding:30px;display:grid;gap:14px;align-content:start}
.modal-form h2{font-size:26px}
.modal-sum{padding:30px;background:var(--light);display:grid;gap:14px;align-content:center;border-left:4px solid var(--cyan)}
.modal-sum h3{font-size:13px;color:var(--muted)}
.sum-row{padding:14px 16px;border-radius:12px;background:#fff}
.sum-row .k{font-size:11.5px;font-weight:700;color:var(--muted)}
.sum-row b{display:block;font-size:16px;color:var(--blue)}
.sum-row.split{display:flex;justify-content:space-between;gap:12px;align-items:center}
.modal-x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(11,42,111,.08);color:var(--blue);font-size:22px;line-height:1;cursor:pointer;z-index:1}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:600;color:var(--ink)}
.agree input{width:20px;height:20px;accent-color:var(--blue);flex:none;margin-top:2px}
.reqnote{font-size:12.5px;color:var(--muted)}
.detail{margin-top:auto;padding:16px;border-radius:14px;background:var(--ink);color:#fff}
.detail .k{font-size:11.5px;font-weight:700;color:var(--cyan)}
.detail h3{color:#fff;font-size:19px;margin-top:6px}
.detail p{font-size:13.5px;line-height:1.65;margin-top:8px;color:rgba(255,255,255,.88)}
.map-stage{position:relative;min-width:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.2))}
.map-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.map-scroll svg{display:block;width:100%;height:auto;min-width:560px}
.map-note{font-size:12.5px;color:var(--muted);padding:10px 20px 16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 20px 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:22px;height:4px;background:var(--blue);display:inline-block}
.legend i.s{background:var(--cyan);box-shadow:0 0 0 2px var(--blue)}
.legend i.g{width:9px;height:9px;background:var(--orange);transform:rotate(45deg)}
.m-label{font:700 17px var(--font);fill:var(--blue)}
.m-sub{font:600 13px var(--font);fill:var(--muted)}
.m-sea{font:600 14px var(--font);fill:#2B6F94;letter-spacing:.18em}
.node{cursor:pointer;transition:opacity .25s}
.node .ring{fill:#fff;stroke:var(--blue);stroke-width:3}
.node .dot{fill:var(--blue)}
.node[data-kind="sea"] .dot{fill:var(--cyan)}
.node[data-kind="gate"] .dot{fill:var(--orange)}
.node .halo{fill:var(--cyan);opacity:0;transition:opacity .2s}
.node.on .halo,.node:focus-visible .halo{opacity:.3}
.node:focus-visible{outline:none}
.node.on .ring{stroke-width:4.5}
.cable{fill:none;stroke-linecap:round;transition:opacity .25s}
.cable.land{stroke:var(--blue);stroke-width:5}
.cable.sea{stroke:var(--cyan);stroke-width:5}
.cable.sea-under{stroke:var(--blue);stroke-width:9}
.dimmed{opacity:.16}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;margin-top:36px;align-items:start}
.panel{padding:26px}
.panel h3{font-size:20px}
.spec{width:100%;border-collapse:collapse;margin-top:14px}
.spec th,.spec td{text-align:left;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px;vertical-align:top}
.spec th{font-weight:700;color:var(--blue);width:44%;padding-right:12px}
.spec td{color:var(--muted)}
.dl{display:grid;gap:12px;margin-top:14px}
.dl p{font-size:14px;color:var(--muted)}

/* ---------- industries ---------- */
.ind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:8px}
.ind-item{padding:28px;display:flex;flex-direction:column;gap:14px}
.ind-item h3{font-size:21px}
.ind-item dl{margin:0;display:grid;gap:12px}
.ind-item dt{font-size:12px;font-weight:700;color:var(--muted)}
.ind-item dd{margin:2px 0 0;font-size:15px;color:var(--ink)}
.ind-num{font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:10px}
.ind-num::before{content:"";width:26px;height:4px;background:var(--cyan)}

/* ---------- about ---------- */
.tl{display:grid;gap:0;margin-top:30px}
.tl-item{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid var(--blue)}
.tl-item .y{font-size:22px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.tl-item h3{font-size:18px}
.tl-item p{color:var(--muted);font-size:15px;margin-top:6px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.co{padding:26px 24px}
.co .k{font-size:12px;font-weight:700;color:var(--muted)}
.co h3{font-size:20px;margin-top:8px}
.co p{font-size:14px;color:var(--muted);margin-top:8px}
.co a{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:700}
.co.me{background:var(--blue);border-color:rgba(255,255,255,.3)}
.co.me h3,.co.me .k{color:#fff}
.co.me p{color:rgba(255,255,255,.9)}

/* ---------- contact / RFQ ---------- */
.contact{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:28px;align-items:start;margin-top:8px}
.info{display:grid;gap:14px}
.info .glass{padding:20px 22px}
.info h3{font-size:17px}
.info p{font-size:14px;color:var(--muted);margin-top:6px}
.form{padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form h3{grid-column:1/-1;font-size:20px}
.fld{display:grid;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld legend{font-size:12.5px;font-weight:700;color:var(--blue);padding:0}
.fld input:not([type=checkbox]),.fld textarea,.fld select{width:100%;font:500 16px/22px var(--font);color:var(--ink);min-height:46px;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.88)}
.fld textarea{min-height:104px;resize:vertical}
fieldset.fld{border:0;margin:0;padding:0}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:4px}
.checks label{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);min-height:36px}
.checks input{width:18px;height:18px;accent-color:var(--blue)}
.send{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.msg{font-size:13.5px;font-weight:600;color:var(--blue)}

/* ---------- footer ---------- */
footer{background:var(--white);border-top:1px solid var(--line)}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;padding-block:48px 26px}
.foot h4{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--blue)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.foot li a{display:inline-block;padding:4px 0;font-size:14px;color:var(--muted);text-decoration:none}
.foot li a:hover{color:var(--blue);text-decoration:underline}
.foot .lang{display:inline-flex}
.foot p{font-size:14px;color:var(--muted);margin-top:14px;max-width:36ch}
.legal{border-top:1px solid var(--line);padding-block:16px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.rise.d1{animation-delay:.07s}.rise.d2{animation-delay:.14s}.rise.d3{animation-delay:.22s}
@keyframes rise{from{transform:translateY(16px);opacity:.01}to{transform:none;opacity:1}}

@media (max-width:1120px){
  .tabs,.nav-cta{display:none}
  .menu-btn{display:flex}
}
@media (max-width:900px){
  .modal-box{grid-template-columns:minmax(0,1fr)}
  .modal-sum{border-left:0;border-top:4px solid var(--cyan);order:-1;padding:20px 20px 16px}
  .modal-form{padding:20px}
  .hero-grid,.map-card,.two,.contact{grid-template-columns:minmax(0,1fr)}
  .map-side{border-right:0;border-bottom:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three{grid-template-columns:minmax(0,1fr)}
  .svc-item{grid-template-columns:56px minmax(0,1fr)}
  .svc-item .side{grid-column:1/-1}
  .hero-art{min-height:370px}
  .foot{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  body{font-size:15.5px}
  .sec{padding-block:52px}
  .hero{padding-top:calc(env(safe-area-inset-top,0px) + 112px);padding-bottom:48px}
  .phead{padding-top:calc(env(safe-area-inset-top,0px) + 108px);padding-bottom:24px}
  .hero .lead,.lead{font-size:16px}
  .stats,.quick,.ind,.form{grid-template-columns:minmax(0,1fr)}
  .cta-row .btn,.svc-act .btn,.send .btn{flex:1 1 100%}
  .svc-item,.ind-item,.panel,.form{padding:20px}
  .svc-item{grid-template-columns:minmax(0,1fr)}
  .tl-item{grid-template-columns:minmax(0,1fr);gap:4px}
  .foot{grid-template-columns:1fr}
  .hero-art{min-height:330px}
  .hero-art .strands{right:-50px;width:125%}
  .f1{top:20px}
  .logo{height:30px}
  .nav-bar{padding-left:14px}
}
@media (max-width:380px){
  .nav-bar > .nav-right > .lang{display:none}
}
@media (prefers-reduced-motion:reduce){
  .rise{animation:none}
  .pulse{display:none}
  *{transition:none!important}
}


/* ===== one-page layout (first demo) ===== */
section[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.sec{padding-block:80px}
.about2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:36px}
.about2 .glass{padding:28px}
.about2 h3{font-size:21px}
.about2 p{color:var(--muted);margin-top:12px;font-size:15.5px}
.card .ticks{margin-top:2px}
.card .ticks li{font-size:13px}
.rows{display:grid;gap:64px;margin-top:48px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.row.flip .row-art{order:2}
.row h3{font-size:clamp(22px,2.6vw,30px);margin-top:12px}
.row p{color:var(--muted);margin-top:14px;max-width:56ch}
.row .y{font-size:13px;font-weight:700;color:var(--muted);margin-top:14px}
.row-art{position:relative;min-height:300px;border-radius:var(--r-lg);overflow:hidden;background:var(--white);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
.row-art svg{position:absolute;inset:0;width:100%;height:100%}
.row-art .tag{position:absolute;left:18px;bottom:18px;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700;color:var(--blue)}
.info3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.info3 .glass{padding:20px 22px}
.info3 h3{font-size:17px}
.info3 p{font-size:14px;color:var(--muted);margin-top:6px}
.form-wide{margin-top:20px}

/* ===== 3D logo ===== */
.logo-link{gap:10px;text-decoration:none}
.l3d{display:block;width:36px;height:36px;perspective:260px;flex:none}
.l3d-in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:l3d 7s ease-in-out infinite;will-change:transform}
.logo-link:hover .l3d-in{animation-duration:2.4s}
.l3d-in > *{position:absolute;inset:0;width:100%;height:100%;display:block}
.l3d-base{border-radius:4px;background:var(--light);box-shadow:inset 0 0 0 1px rgba(11,42,111,.10)}
.l3d-side{border-radius:4px;background:#B9C3D6}
.l3d-shadow{border-radius:6px;background:rgba(7,26,69,.28);filter:blur(5px);transform:translateZ(-14px) translateY(5px) scale(.9)}
@keyframes l3d{0%,100%{transform:rotateY(-26deg) rotateX(10deg)}50%{transform:rotateY(26deg) rotateX(-8deg)}}
.wm{display:block;height:13px;width:auto}

/* ===== map ===== */
.map-card{margin-top:36px;grid-template-columns:minmax(0,1fr)}
.map-card .map-stage{order:1}
.map-card .map-side{order:2;border-right:0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;align-items:start}
.map-side .eq{margin-top:0;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end}
.map-side .eq > .eq-h,.map-side .eq > .eq-hint,.map-side .eq > .btn,.map-side .eq > .reqnote{grid-column:1/-1}
.map-side .eq > .btn{justify-self:start;width:auto;min-width:260px}
.map-stage{background:#F4F7FB;overflow:hidden}
.map-scroll svg{min-width:640px;touch-action:pan-y}
.map-scroll.zoomed svg{cursor:grab;touch-action:none}
.map-tools{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;z-index:2;pointer-events:none}
.map-tools > *{pointer-events:auto}
.tool{background:rgba(255,255,255,.72);border:1px solid var(--glass-edge);box-shadow:0 8px 24px rgba(7,26,69,.14),inset 0 1px 0 #fff;-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}
.map-tools .seg{flex:0 1 auto;min-width:0}
.map-tools .seg button{padding:8px 14px;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;border-radius:var(--r-pill);padding:0 14px;flex:1 1 200px;max-width:320px;min-height:48px}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;font:500 16px/22px var(--font);color:var(--ink);padding:10px 0;outline:none}
.search:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.zoom{position:absolute;right:12px;bottom:14px;display:grid;gap:8px;z-index:2}
.zoom button{width:44px;height:44px;border-radius:50%;font:700 20px/1 var(--font);color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom button:disabled{opacity:.45;cursor:default}
.legend{position:absolute;left:12px;bottom:14px;z-index:2;padding:10px 14px;border-radius:14px;gap:6px 16px;max-width:calc(100% - 80px)}
.map-note{padding:12px 20px 16px}
.g-land{fill:#DCE2ED}
.g-sea{fill:#F4F7FB}
.g-geo{fill:#C5D0E4;stroke:#fff;stroke-width:2;stroke-linejoin:round}
.g-cn{font:700 12px var(--font);font-size:calc(12px / var(--k,1));fill:#7A86A0;letter-spacing:.16em}
.g-cn.me{fill:var(--blue);font-size:calc(13px / var(--k,1))}
.g-seal{font:600 13px var(--font);fill:#5E8FB0;letter-spacing:.2em}
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s}
.rt.land{stroke:var(--blue);stroke-width:2.6}
.rt.sea{stroke:var(--cyan);stroke-width:2.6}
.rt.sea-c{stroke:var(--blue);stroke-width:5.2}
.mk{cursor:pointer;transition:opacity .25s;outline:none}
.mk .glowc,.mk .rip{pointer-events:none}
.mk .glowc{opacity:.55;transform-box:fill-box;transform-origin:center;animation:breathe 3.2s ease-in-out infinite}
.mk .disc{fill:var(--ink);stroke:#fff;stroke-width:2}
.mk .in{fill:#fff}
.mk[data-kind="gate"] .in{fill:var(--orange)}
.mk[data-kind="sea"] .in{fill:var(--cyan)}
.mk.on .disc{stroke:var(--orange);stroke-width:3}
.mk:focus-visible{outline:none}
.mk:focus-visible .disc{stroke:var(--orange);stroke-width:3}
.mk text{font:700 14px var(--font);font-size:calc(14px / var(--k,1));fill:var(--ink);paint-order:stroke;stroke:#F4F7FB;stroke-width:calc(4px / var(--k,1));stroke-linejoin:round}
.pop[hidden]{display:none}
.nores{font-size:13px;font-weight:600;color:var(--muted);padding:6px 4px}
@keyframes breathe{0%,100%{transform:scale(.8)}50%{transform:scale(1.15)}}

/* ===== presentation data + motion ===== */
.pop{transition:background .25s,border-color .25s,opacity .25s,transform .15s}
.pop:active{transform:scale(.985)}
.pop[data-kind="city"]::before{width:8px;height:8px;margin:0 1px;background:#fff;box-shadow:0 0 0 2.5px var(--ink)}
.pcap{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.seg button{transition:background .25s,box-shadow .25s}
.legend i.c{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px var(--ink)}
.legend i.b{background:repeating-linear-gradient(90deg,var(--blue) 0 4px,transparent 4px 8px);opacity:.75}
.ep{align-items:start;transition:background .35s,box-shadow .35s}
.ep .bdg{margin-top:2px;transition:background .35s,color .35s,box-shadow .35s}
.ep-main{min-width:0}
.ep-data{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.ep.has .ep-data{grid-template-rows:1fr}
.ep-data-in{overflow:hidden;min-height:0}
.ep-type{font-size:12px;font-weight:600;color:var(--muted);padding-top:4px}
.ep-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;line-height:1.45;padding-top:6px;margin-top:6px;border-top:1px solid var(--line)}
.ep-row span{color:var(--muted);font-weight:600}
.ep-row b{display:inline;font-size:13px;color:var(--blue);text-align:right;font-variant-numeric:tabular-nums}
.ep-row b.off{color:var(--muted)}
.eq-clear{opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.eq-clear.show{opacity:1;visibility:visible}
.eq-net{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1),opacity .35s}
.eq-net.open{grid-template-rows:1fr;opacity:1}
.eq-net-in{overflow:hidden;min-height:0;display:flex;flex-wrap:wrap;gap:8px}
.eq-net-in span{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:var(--r-pill);background:var(--light);font-size:13px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.eq-net-in em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted)}
.map-side .eq > .eq-net{grid-column:1/-1}
.eq .btn{transition:background .35s,color .35s,box-shadow .35s,transform .2s}
.bw-top output{display:inline-block}
.fx-in{animation:fxIn .42s cubic-bezier(.2,.7,.2,1) both}
.bump{animation:bump .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes fxIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1.14)}100%{transform:scale(1)}}
.rt.bk{stroke:var(--blue);stroke-width:1.6;stroke-dasharray:4 4;stroke-opacity:.6}
.flow{fill:none;stroke-linecap:round;pointer-events:none;transition:opacity .25s}
.flow.fl{stroke:var(--cyan);stroke-width:1.9;stroke-dasharray:7 33;animation:flowL 2.4s linear infinite}
.flow.fs{stroke:#fff;stroke-width:1.9;stroke-dasharray:9 41;animation:flowS 3.2s linear infinite}
@keyframes flowL{to{stroke-dashoffset:-40}}
@keyframes flowS{to{stroke-dashoffset:-50}}
.capl{font:700 11.5px var(--font);font-size:calc(11.5px / var(--k,1));fill:var(--blue);paint-order:stroke;stroke:#F4F7FB;stroke-width:calc(4px / var(--k,1));stroke-linejoin:round;transition:opacity .25s}
.mk .disc{transform-box:fill-box;transform-origin:center;transition:transform .3s cubic-bezier(.3,1.4,.5,1),stroke .25s,stroke-width .25s}
.mk:hover .disc{transform:scale(1.18);stroke:var(--cyan)}
.mk .rip{fill:none;stroke:var(--cyan);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.mk:hover .rip,.mk:focus-visible .rip{animation:rip 1.6s cubic-bezier(.2,.6,.3,1) infinite}
.mk.on .rip{stroke:var(--orange);animation:rip 2s cubic-bezier(.2,.6,.3,1) infinite}
.mk.on .glowc{opacity:.9;animation-duration:2s}
@keyframes rip{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.link,.link-glow{stroke-dasharray:1}
.link.draw,.link-glow.draw{animation:draw .8s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mtag .tg{transform-box:fill-box;transform-origin:center}
.tag-in{animation:tagIn .4s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tagIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
#mapSvg.paused .flow,#mapSvg.paused .glowc,#mapSvg.paused .rip{animation-play-state:paused}
.modal:not([hidden]){animation:mFade .25s ease both}
.modal:not([hidden]) .modal-box{animation:mBox .38s cubic-bezier(.2,.8,.2,1) both}
.modal.closing{animation:mFadeOut .2s ease both}
.modal.closing .modal-box{animation:mBoxOut .2s ease both}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mFadeOut{from{opacity:1}to{opacity:0}}
@keyframes mBox{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes mBoxOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px) scale(.99)}}
.sheet:not([hidden]){animation:sheetIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.stats.hl{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:36px}
.stats.hl + .stats{margin-top:16px}
.stat.big{padding:30px 28px;background:rgba(255,255,255,.12);border-color:rgba(0,212,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 50px rgba(0,212,255,.14)}
.stat.big .lbl{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink);background:var(--cyan);padding:4px 10px;border-radius:var(--r-pill);margin-bottom:16px}
.stat.big .n{font-size:clamp(44px,6vw,76px)}
.stat.big .n small{font-size:.45em;font-weight:700;color:var(--cyan);margin-left:6px}
.stat.big p{font-size:15px}

/* ===== v7: lighter sizing ===== */
.sec{padding-block:64px}
.h2{font-size:clamp(24px,3vw,34px)}
.lead{font-size:16px}
.hero h1{font-size:clamp(30px,4.2vw,50px)}
.hero .lead{font-size:17px}
.card{padding:22px 20px;gap:10px}
.card h3{font-size:16.5px}
.card p{font-size:13.5px}
.ind-item{padding:24px;gap:12px}
.ind-item h3{font-size:18px}
.ind-item dd{font-size:14px}
.row h3{font-size:clamp(20px,2.2vw,26px)}
.about2 h3{font-size:19px}
.about2 p{font-size:15px}
.stat.big .n{font-size:clamp(40px,5vw,64px)}
/* ===== v7: service cards ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.card.sv{position:relative;isolation:isolate;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.card.sv::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang),rgba(0,212,255,0) 0deg,rgba(0,212,255,0) 200deg,#00D4FF 290deg,#ffffff 320deg,#00D4FF 340deg,rgba(0,212,255,0) 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s;pointer-events:none;z-index:1}
.card.sv:hover::before,.card.sv:focus-visible::before,.card.sv.active::before{opacity:1;animation:spinB 3.2s linear infinite}
.card.sv.active::before{animation-duration:2.2s}
.card.sv.active{transform:translateY(-4px);box-shadow:0 26px 60px rgba(7,26,69,.18),0 0 0 1px rgba(0,212,255,.25),inset 0 1px 0 #fff}
.card.sv:focus-visible{outline:none}
@keyframes spinB{to{--ang:360deg}}
.sv-more{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1),opacity .3s}
.card.sv.active .sv-more{grid-template-rows:1fr;opacity:1}
.sv-more > div{overflow:hidden;min-height:0}
.sv-tog{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--blue)}
.sv-tog i{position:relative;width:22px;height:22px;border-radius:50%;background:rgba(11,42,111,.08);flex:none;transition:background .3s,transform .35s cubic-bezier(.3,1.4,.5,1)}
.sv-tog i::before,.sv-tog i::after{content:"";position:absolute;left:6px;right:6px;top:10px;height:2px;background:var(--blue);border-radius:2px}
.sv-tog i::after{transform:rotate(90deg);transition:transform .3s}
.card.sv.active .sv-tog i{background:var(--cyan);transform:rotate(180deg)}
.card.sv.active .sv-tog i::after{transform:rotate(0)}
.sv-more .ticks{margin-top:4px}
.sv-more .more{margin-top:12px}
/* ===== v7: simple map block ===== */
.slab.sm{font-size:calc(10.5px / var(--k,1));font-weight:500}
.m-two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.modal-sum .ep-chips span{background:#fff}
.cards{align-items:start}
.card.sv{min-height:300px}
.map-side .eq-hint{background:none;padding:0;font-size:13px;color:var(--muted);font-weight:600}
.map-card{align-items:start}
.map-card{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)!important;align-items:stretch}
.map-card .map-stage{order:1;display:flex;flex-direction:column}
.map-card .map-side{order:2;border-top:0!important;border-left:1px solid var(--line);display:block!important;padding:22px}
.map-side .eq{display:grid;grid-template-columns:minmax(0,1fr)!important;gap:12px;background:none;border:0;padding:0}
.map-side .eq > .btn{width:100%!important;min-width:0!important;justify-self:stretch!important}
.map-tools{justify-content:flex-end}
.map-scroll{flex:1}
.map-scroll svg{min-width:0}
.legend{position:static!important;margin:0;padding:10px 16px 14px;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:12px;max-width:none!important;gap:6px 14px}
.zoom{bottom:58px}
.zoom button{width:38px;height:38px;font-size:18px}
.mk text{font-size:calc(13px / var(--k,1))}
.g-cn{font-size:calc(11px / var(--k,1))}
.g-cn.me{font-size:calc(12px / var(--k,1))}
.sdot{fill:var(--ink);stroke:#fff;stroke-width:2}
.slab{font:600 12px var(--font);font-size:calc(12px / var(--k,1));fill:#2B6F94;paint-order:stroke;stroke:#F4F7FB;stroke-width:calc(4px / var(--k,1));stroke-linejoin:round}
.epf{display:grid;gap:6px}
.epf label{display:flex;align-items:center;gap:8px}
.epf .bdg{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.epf select{margin-top:0!important}
.ep-chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.ep-chips span{display:inline-flex;gap:6px;align-items:baseline;padding:5px 10px;border-radius:var(--r-pill);background:var(--light);font-size:12px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.ep-chips span.off{color:var(--muted)}
.ep-chips em{font-style:normal;font-weight:600;color:var(--muted)}
.epf.has .ep-data{grid-template-rows:1fr}

/* ===== v8: map in the style of a carrier network map ===== */
.map-card{display:block!important;padding:0;overflow:hidden;margin-top:28px}
.map-card .map-stage{position:relative;display:block;background:#F4F6F9}
.map-scroll{overflow:hidden!important;padding:0!important}
.map-scroll svg{display:block;width:100%;height:auto;min-width:0!important}
.g-land{fill:#E1E5EC}
.g-sea{fill:#F4F6F9}
.g-geo{fill:#D2D9E5;stroke:#fff;stroke-width:2}
.g-cn{fill:#9AA3B5}
.g-cn.me{fill:var(--blue)}
.g-seal{fill:#7FA3BE}
.mk text{stroke:#E1E5EC}
.ctx circle{fill:#9AA3B5}
.ctx text{font:500 11px var(--font);font-size:calc(11px / var(--k,1));fill:#7A859B;paint-order:stroke;stroke:#E1E5EC;stroke-width:calc(3px / var(--k,1))}
.nobk .rt.bk{opacity:0}
.rt.bk{transition:opacity .3s}
.mt{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
.mt > *{pointer-events:auto}
.mfilt{position:relative;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.mpanel-open .mfilt{opacity:0;pointer-events:none;transform:translateX(-10px)}
.mbox{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(7,26,69,.12)}
.fbtn{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;font:600 14px var(--font);color:var(--ink);cursor:pointer}
.fbtn svg{width:20px;height:20px;flex:none}
.fbtn .chev{width:14px;height:14px;transition:transform .3s}
.mfilt.open .fbtn .chev{transform:rotate(180deg)}
.fmenu{position:absolute;left:0;top:56px;width:290px;padding:14px;display:grid;gap:8px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}
.mfilt.open .fmenu{opacity:1;visibility:visible;transform:none}
.fmenu .ft{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.fmenu label{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--ink);min-height:34px;cursor:pointer}
.fmenu input{accent-color:var(--blue);width:18px;height:18px;flex:none;margin:0}
.fmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.lgm{display:grid;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.lgm span{display:flex;align-items:center;gap:10px}
.lgm i{width:22px;height:4px;background:var(--blue);display:inline-block;flex:none}
.lgm i.s{background:var(--cyan);box-shadow:0 0 0 2px var(--blue)}
.lgm i.b{background:repeating-linear-gradient(90deg,var(--blue) 0 4px,transparent 4px 8px);opacity:.75}
.lgm i.g{width:9px;height:9px;background:var(--orange);transform:rotate(45deg);margin:0 6px}
.lgm i.c{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px var(--ink);margin:0 6px}
.msearch{position:relative;flex:0 1 420px;min-width:0}
.sbox{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 6px 0 16px}
.sbox svg{width:19px;height:19px;flex:none}
.sbox input{flex:1;min-width:0;border:0;background:none;font:500 16px/22px var(--font);color:var(--ink);padding:12px 0;outline:none}
.sbox:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.sclr{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--blue);font:600 20px/1 var(--font);cursor:pointer;opacity:0;visibility:hidden;transition:opacity .2s}
.sclr.show{opacity:1;visibility:visible}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sres{position:absolute;left:0;right:0;top:56px;padding:6px;display:grid;gap:2px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .25s,visibility .25s;max-height:300px;overflow:auto}
.sres.open{opacity:1;visibility:visible;transform:none}
.sres button{display:grid;gap:1px;text-align:left;padding:9px 12px;border:0;border-radius:10px;background:none;cursor:pointer;font-family:var(--font)}
.sres button b{font-size:14px;color:var(--ink)}
.sres button span{font-size:12px;color:var(--muted);font-weight:500}
.sres button:hover,.sres button.hl{background:var(--light)}
.sres p{margin:0;padding:10px 12px;font-size:13px;color:var(--muted);font-weight:600}
.map-stage .zoom{position:absolute;right:14px;bottom:14px;top:auto;display:grid;gap:8px;z-index:3}
.map-stage .zoom button{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(7,26,69,.12);color:var(--blue);font:600 20px/1 var(--font);-webkit-backdrop-filter:none;backdrop-filter:none}
.mphint{position:absolute;left:14px;bottom:14px;z-index:2;margin:0;padding:10px 14px;font-size:13px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:8px;transition:opacity .3s}
.mphint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(0,212,255,.2)}
.mpanel-open .mphint{opacity:0;pointer-events:none}
.mpanel{position:absolute;left:14px;top:14px;bottom:14px;width:min(370px,calc(100% - 28px));z-index:4;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;box-shadow:0 26px 60px rgba(7,26,69,.22);transform:translateX(calc(-100% - 24px));opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s,visibility .5s}
.mpanel.open{transform:none;opacity:1;visibility:visible}
.mp-body{flex:1;overflow:auto;padding:14px 18px 14px;display:grid;gap:14px;align-content:start;overscroll-behavior:contain}
.mp-foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:grid;gap:10px;background:#fff}
.mp-foot .btn{width:100%}
.mp-foot .eq-hint{background:none;padding:0;margin:0;font-size:12.5px;color:var(--muted);font-weight:600}
.mp-back{justify-self:start;display:inline-flex;align-items:center;gap:8px;font:600 14px var(--font);color:var(--blue);background:none;border:0;padding:4px 0;min-height:36px;cursor:pointer}
.mp-back svg{width:16px;height:16px}
.mp-a h3{font-size:21px}
.mp-a .t{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.mp-st{font-size:14.5px;font-weight:700;color:var(--ink)}
.mp-ss{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.svl{display:grid;gap:2px;border:1px solid var(--line);border-radius:14px;padding:6px}
.svl label{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:background .2s}
.svl label:hover{background:var(--light)}
.svl label.on{background:rgba(0,212,255,.14)}
.svl input{accent-color:var(--blue);width:18px;height:18px;flex:none;margin:0}
.eps{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 10px;border:1px solid var(--line);border-radius:14px;padding:12px}
.rail{grid-row:1/3;display:flex;flex-direction:column;align-items:center;padding:18px 0 22px}
.rail svg{width:18px;height:18px;flex:none}
.rail .ln{flex:1;width:0;border-left:2px dotted var(--gray);margin:6px 0}
.rail .rg{width:12px;height:12px;border-radius:50%;border:2px solid var(--blue);flex:none;transition:background .3s}
.eps.both .rail .rg{background:var(--blue)}
.epc{padding:6px 0 10px;min-width:0}
.epc + .epc{border-top:1px solid var(--line);padding-top:10px}
.epc .k{font-size:11.5px;font-weight:700;color:var(--muted)}
.epc .box{margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--light)}
.epc .box b{display:block;font-size:15px;color:var(--blue);line-height:1.3}
.epc .box .t{font-size:12px;color:var(--muted);font-weight:600}
.epc .box.empty{background:none;border:1.5px dashed var(--gray);color:var(--muted);font-size:13px;font-weight:600}
.epc .box select{width:100%;margin-top:8px;font:500 15px/20px var(--font);min-height:42px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink)}
.epc .row-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.epc .xb{font:700 12.5px var(--font);color:var(--blue);background:none;border:0;cursor:pointer;min-height:32px;padding:4px}
.mp-net{display:flex;flex-wrap:wrap;gap:6px}
.mp-net span{display:inline-flex;gap:6px;align-items:baseline;padding:6px 11px;border-radius:var(--r-pill);background:var(--light);font-size:12.5px;font-weight:700;color:var(--blue)}
.mp-net em{font-style:normal;font-weight:600;color:var(--muted)}
.svgwrap{position:relative}
@media (max-width:700px){
  .mt{position:relative;z-index:6;padding:12px;flex-wrap:nowrap;background:#fff;border-bottom:1px solid var(--line)}
  .mpanel-open .mfilt{opacity:1;pointer-events:auto;transform:none}
  .fbtn{padding:0 12px}
  .fbtn .lbl{display:none}
  .msearch{flex:1 1 auto}
  .fmenu{width:min(290px,calc(100vw - 56px))}
  .mpanel{position:static;width:auto;transform:none;opacity:1;visibility:visible;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;display:none}
  .mpanel.open{display:flex;animation:fxIn .4s cubic-bezier(.2,.7,.2,1) both}
  .mp-body{overflow:visible}
  .mphint{position:static;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none}
  .mpanel-open .mphint{display:none}
  .map-stage .zoom{right:10px;bottom:10px;gap:6px}
  .map-stage .zoom button{width:38px;height:38px;font-size:18px}
}

/* ===== v9: smaller facts + map ===== */
.band.sec{padding-block:52px}
.stats.hl{margin-top:24px;gap:12px}
.stats.hl + .stats{margin-top:12px}
.stats{gap:12px}
.stat{padding:16px 18px}
.stat .n{font-size:clamp(24px,2.6vw,32px)}
.stat .bar{width:26px;height:3px;margin:10px 0 8px}
.stat p{font-size:13px;line-height:1.5}
.stat.big{padding:18px 22px}
.stat.big .lbl{font-size:11px;padding:3px 9px;margin-bottom:8px}
.stat.big .n{font-size:clamp(30px,3.4vw,42px)}
.stat.big p{font-size:13.5px}
@media (min-width:701px){.map-scroll svg{height:420px}}

/* ===== v10: moving border on every framed card ===== */
.fxb{position:relative;isolation:isolate}
.fxb::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang),rgba(0,212,255,0) 0deg,rgba(0,212,255,0) 200deg,#00D4FF 290deg,#ffffff 320deg,#00D4FF 340deg,rgba(0,212,255,0) 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s;pointer-events:none;z-index:5}
.fxb:hover::before{opacity:1;animation:spinB 3.2s linear infinite}
.fxb{transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.fxb:hover{transform:translateY(-2px)}
.form.fxb:hover,.panel.fxb:hover{transform:none}

/* ===== v11: presentation schemes ===== */
.sch{margin-top:20px;padding:24px}
.sch .eyebrow{margin-bottom:6px}
.sch > h3{font-size:20px}
.sch > p{font-size:14px;color:var(--muted);margin-top:6px;max-width:70ch}
.sch-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:rgba(11,42,111,.07);width:max-content;max-width:100%;margin-top:16px}
.sch-tabs button{font:600 13.5px var(--font);color:var(--blue);background:none;border:0;padding:9px 16px;border-radius:999px;cursor:pointer;min-height:40px;transition:background .25s,box-shadow .25s}
.sch-tabs button[aria-selected="true"]{background:#fff;box-shadow:0 3px 10px rgba(7,26,69,.14)}
.sch-pane{margin-top:16px}
.sch-pane[hidden]{display:none}
.sch-pane:not([hidden]){animation:fxIn .45s cubic-bezier(.2,.7,.2,1) both}
.sch-pane h4{font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 10px;letter-spacing:.02em}
.sch-fig{border-radius:16px;background:#071A45;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sch-fig svg{display:block;width:100%;min-width:760px;height:auto}
.sch-lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:600}
.sch-lg span{display:inline-flex;align-items:center;gap:8px}
.sch-lg i{display:inline-block;width:24px;height:3px;background:#00D4FF;box-shadow:0 0 0 1px #071A45}
.sch-lg i.bk{background:repeating-linear-gradient(90deg,#071A45 0 5px,transparent 5px 9px);box-shadow:none;height:2px}
.sch-lg i.ex{background:repeating-linear-gradient(90deg,#8A94A6 0 2px,transparent 2px 6px);box-shadow:none;height:2px}
.sch-lg i.sv{background:#FF7A00;box-shadow:none}
.sch-lg i.cb{width:12px;height:12px;border-radius:50%;background:none;box-shadow:inset 0 0 0 2px #00D4FF}
.sch-lg i.gw{width:12px;height:12px;border-radius:50%;background:none;box-shadow:inset 0 0 0 2px #FF7A00}
.sch-stage{position:relative}
.sch-fig{position:relative;background:radial-gradient(120% 90% at 85% 10%,#123A8F 0%,rgba(18,58,143,0) 55%),radial-gradient(90% 80% at 10% 100%,rgba(255,122,0,.16) 0%,rgba(255,122,0,0) 55%),#071A45}
.sch-fig svg{min-width:780px}
.mx .l-glow{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.28}
.mx .l-core{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mx .pri .l-glow{stroke:#00D4FF;stroke-width:12}
.mx .pri .l-core{stroke:#00D4FF;stroke-width:3}
.mx .svc .l-glow{stroke:#FF7A00;stroke-width:11}
.mx .svc .l-core{stroke:#FF7A00;stroke-width:2.6}
.mx .bk line{fill:none;stroke:#fff;stroke-opacity:.55;stroke-width:2;stroke-dasharray:6 7;animation:sxMarch 1.6s linear infinite}
.mx .ex line{fill:none;stroke:#B9C3D6;stroke-opacity:.6;stroke-width:1.8;stroke-dasharray:1.5 7;stroke-linecap:round}
.mx .draw{stroke-dasharray:1;stroke-dashoffset:1}
.mx.play .draw{animation:sxDraw .9s cubic-bezier(.6,0,.2,1) forwards;animation-delay:var(--d,0s)}
.mx .fadein,.mx .bgd,.mx .pt{opacity:0}
.mx.play .fadein{animation:sxFade .6s ease forwards;animation-delay:var(--d,0s)}
.mx.play .bgd{animation:sxFade 1s .05s forwards}
.mx.play .pt{animation:sxFade .6s 1.8s forwards}
.mx .mnode{cursor:pointer;opacity:0;outline:none}
.mx .pop{transform-box:fill-box;transform-origin:center}
.mx.play .mnode{animation:sxFade .01s forwards;animation-delay:var(--d,0s)}
.mx.play .mnode .pop{animation:sxPop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0s)}
.mx .halo{transform-box:fill-box;transform-origin:center;animation:sxHalo 2.8s ease-in-out infinite}
.mx .ring{fill:none;stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:0}
.mx .mnode:hover .ring,.mx .mnode.hl .ring{animation:sxRing 1.6s cubic-bezier(.2,.6,.3,1) infinite}
.mx .front{transition:filter .25s}
.mx .mnode:hover .front,.mx .mnode.hl .front{filter:brightness(1.35)}
.mx .led{animation:sxLed 2.4s ease-in-out infinite}
.mx .core{animation:sxCore 3s ease-in-out infinite}

function optText(id){var el=document.getElementById(id);if(!el)return '';if(el.tagName==='SELECT'){var o=el.options[el.selectedIndex];return el.value===''?'':(o?o.text:'')}return el.type==='checkbox'?el.checked:el.value.trim()}

 fetch(CFG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
  .then(function(r){onDone(r.ok?'sent':'fail')}).catch(function(){onDone('fail')});
